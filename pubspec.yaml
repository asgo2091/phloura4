name: phloura
description: "A diary for your garden."
publish_to: 'none'
version: 2.0.5+13

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.5
  firebase_auth: ^6.6.1
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_widget_from_html: ^0.17.2
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.1
  in_app_purchase_storekit: ^0.4.10+1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  sqflite: ^2.4.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
